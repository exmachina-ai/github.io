<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Форма распределения производственного потребления</title>
  <desc id="desc">Схема показывает рассеяние наблюдений, правый хвост распределения и связь пиков с физической причиной.</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e06820" stop-opacity="0.08"/>
      <stop offset="0.62" stop-color="#e06820" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e06820" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="920" height="430" rx="16" fill="#131316"/>
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <path d="M86 344H836"/>
    <path d="M86 284H836"/>
    <path d="M86 224H836"/>
    <path d="M86 164H836"/>
    <path d="M86 104H836"/>
  </g>
  <g stroke="rgba(255,255,255,0.18)" stroke-width="1.5">
    <path d="M86 344H836"/>
    <path d="M86 344V70"/>
  </g>

  <path d="M96 344 C142 335 165 296 206 245 C245 197 278 165 322 170 C365 174 383 220 420 257 C455 292 498 303 536 295 C587 285 626 242 670 202 C714 162 768 149 828 140 L828 344 Z" fill="url(#area)"/>
  <path d="M96 344 C142 335 165 296 206 245 C245 197 278 165 322 170 C365 174 383 220 420 257 C455 292 498 303 536 295 C587 285 626 242 670 202 C714 162 768 149 828 140" fill="none" stroke="#e06820" stroke-width="4" stroke-linecap="round"/>

  <g fill="#f0f0f2" opacity="0.78">
    <circle cx="138" cy="333" r="3"/>
    <circle cx="178" cy="303" r="3"/>
    <circle cx="216" cy="237" r="3"/>
    <circle cx="256" cy="191" r="3"/>
    <circle cx="296" cy="168" r="3"/>
    <circle cx="338" cy="176" r="3"/>
    <circle cx="378" cy="217" r="3"/>
    <circle cx="418" cy="258" r="3"/>
    <circle cx="458" cy="288" r="3"/>
    <circle cx="502" cy="300" r="3"/>
    <circle cx="548" cy="287" r="3"/>
    <circle cx="596" cy="260" r="3"/>
    <circle cx="642" cy="224" r="3"/>
    <circle cx="690" cy="187" r="3"/>
    <circle cx="744" cy="159" r="3"/>
    <circle cx="800" cy="145" r="3"/>
  </g>

  <g font-family="Consolas, 'Fira Code', monospace" font-size="13" fill="rgba(240,240,242,0.66)">
    <text x="86" y="372">низкое</text>
    <text x="282" y="372">типовая зона</text>
    <text x="628" y="372">P90 / P95</text>
    <text x="764" y="372">пики</text>
    <text x="22" y="82" transform="rotate(-90 22 82)">частота наблюдений</text>
    <text x="650" y="404">потребление / нагрузка за период</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="112" y="82" width="210" height="74" rx="10" fill="#1a1a1e" stroke="rgba(255,255,255,0.13)"/>
    <text x="132" y="112" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f0f0f2">Рассеяние</text>
    <text x="132" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="rgba(240,240,242,0.66)">наблюдения не сводятся к среднему</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="604" y="74" width="242" height="94" rx="10" fill="#1a1a1e" stroke="rgba(224,104,32,0.32)"/>
    <text x="624" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f0f0f2">Правый хвост</text>
    <text x="624" y="130" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="rgba(240,240,242,0.66)">редкие, но физически объяснимые пики</text>
    <text x="624" y="150" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#ffb27a">P95 проектирует устойчивость</text>
  </g>

  <path d="M700 176 C722 218 748 244 792 265" fill="none" stroke="#e06820" stroke-width="2" stroke-dasharray="7 7"/>
  <g>
    <rect x="682" y="272" width="170" height="54" rx="9" fill="rgba(224,104,32,0.1)" stroke="rgba(224,104,32,0.28)"/>
    <text x="700" y="298" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#ffb27a">физическая причина:</text>
    <text x="700" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="rgba(240,240,242,0.72)">пиковый mix, задержка, batch</text>
  </g>
</svg>
